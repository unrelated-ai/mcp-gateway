[workspace]
members = ["crates/*"]
default-members = ["crates/adapter"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
repository = "https://github.com/unrelated-ai/mcp-gateway"

[workspace.dependencies]
http = "1.5.0"
anyhow = "1.0.104"
async-stream = "0.3.6"
async-trait = "0.1.92"
axum = "0.8.9"
base64 = "0.23.1"
bollard = "0.21.1"
chacha20poly1305 = "0.11.0"
chrono = "0.4.45"
clap = "4.6.7"
dirs = "7.0.0"
futures = "0.3.34"
getrandom = "0.4.3"
hex = "0.4.3"
hmac = "0.13.0"
hostname = "0.4.2"
jsonschema = { version = "0.56.0", default-features = false }
jsonwebtoken = "11.1.0"
k8s-openapi = "0.28.0"
keyring = "4.2.0"
kube = { version = "4.2.0", default-features = false }
kube-runtime = "4.2.0"
mime = "0.3.17"
openapiv3 = "2.2.0"
owo-colors = "4.4.0"
parking_lot = "0.12.5"
percent-encoding = "2.3.2"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false }
rmcp = "3.4.0"
rpassword = "7.5.4"
rsa = "0.9.10"
rusty_paseto = "0.10.1"
schemars = "1.2.2"
serde = "1.0.229"
serde-saphyr = "1.3.0"
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false }
sse-stream = "0.2.6"
strsim = "0.11.1"
subtle = "2.6.1"
tempfile = "3.27.0"
testcontainers = "0.28.0"
thiserror = "2.0.20"
time = "0.3.55"
tokio = "1.53.1"
tokio-util = "0.7.19"
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
url = "2.5.8"
uuid = "1.26.1"
webbrowser = "1.2.4"
zeroize = "1.9.0"
