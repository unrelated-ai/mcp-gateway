version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    target-branch: feat/version_one_zero
    schedule:
      interval: weekly
    groups:
      rust:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /ui
    target-branch: feat/version_one_zero
    schedule:
      interval: weekly
    groups:
      ui:
        patterns: ["*"]
  - package-ecosystem: gomod
    directory: /deploy/migrator
    target-branch: feat/version_one_zero
    schedule:
      interval: weekly
    groups:
      migrator:
        patterns: ["*"]
    # See deploy/migrator/README.md: 1.84 is affected by GO-2026-6443.
    ignore:
      - dependency-name: google.golang.org/grpc
        versions: ["1.84.x"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: feat/version_one_zero
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
