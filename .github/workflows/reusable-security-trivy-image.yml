name: reusable-security-trivy-image

on:
  workflow_call:
    inputs:
      image_ref:
        description: "Image reference to build and scan"
        required: true
        type: string
      dockerfile:
        description: "Path to Dockerfile"
        required: true
        type: string
      context:
        description: "Docker build context directory"
        required: true
        type: string
      docker_target:
        description: "Optional Dockerfile target for multi-stage builds"
        required: false
        default: ""
        type: string
      adapter_http_smoke:
        description: "Verify that the Adapter image starts with an HTTP source"
        required: false
        default: false
        type: boolean
      severity:
        description: "Trivy severity filter"
        required: false
        default: "CRITICAL,HIGH"
        type: string
      vuln_type:
        description: "Trivy vulnerability type filter"
        required: false
        default: "os,library"
        type: string
      format:
        description: "Trivy output format"
        required: false
        default: "table"
        type: string

permissions:
  contents: read

jobs:
  trivy_image:
    name: trivy (${{ inputs.image_ref }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: v0.74.0

      - name: Build image (default target)
        if: ${{ inputs.docker_target == '' }}
        run: docker build -f "${{ inputs.dockerfile }}" -t "${{ inputs.image_ref }}" "${{ inputs.context }}"

      - name: Build image (selected target)
        if: ${{ inputs.docker_target != '' }}
        run: docker build -f "${{ inputs.dockerfile }}" --target "${{ inputs.docker_target }}" -t "${{ inputs.image_ref }}" "${{ inputs.context }}"

      - name: Start Adapter with an HTTP source
        if: inputs.adapter_http_smoke
        shell: bash
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/adapter-http.yaml" <<'EOF'
          servers:
            smoke:
              type: http
              baseUrl: http://127.0.0.1:1
              tools:
                ping:
                  method: GET
                  path: /ping
                  response:
                    mode: json
          EOF
          container="adapter-http-smoke-${GITHUB_RUN_ID}-$$"
          trap 'docker logs "$container" || true; docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$container" -p 127.0.0.1::8080 \
            -e UNRELATED_CONFIG=/config/http.yaml \
            -v "${RUNNER_TEMP}/adapter-http.yaml:/config/http.yaml:ro,z" \
            "${{ inputs.image_ref }}"
          address="$(docker port "$container" 8080/tcp)"
          for attempt in {1..20}; do
            if curl -fsS --max-time 2 "http://${address}/health/all" >/dev/null 2>&1; then
              exit 0
            fi
            if [[ "$(docker inspect --format '{{.State.Running}}' "$container")" != true ]]; then
              exit 1
            fi
            sleep 1
          done
          exit 1

      - name: Trivy scan
        shell: bash
        run: |
          set -euo pipefail
          trivy image \
            --format "${{ inputs.format }}" \
            --exit-code 1 \
            --vuln-type "${{ inputs.vuln_type }}" \
            --severity "${{ inputs.severity }}" \
            "${{ inputs.image_ref }}"
