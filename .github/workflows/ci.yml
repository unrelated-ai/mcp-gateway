name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.2
        with:
          cache-on-failure: true

      - name: Verify CRD sync
        run: make crd-sync-check

      - name: Format (rustfmt)
        run: cargo fmt --all -- --check

      - name: Lint (clippy)
        run: cargo clippy --workspace --all-targets -- -D warnings -W clippy::pedantic

      - name: Test
        run: cargo test --workspace --all-targets

      - name: OpenAPI inspection regression (PostgreSQL)
        timeout-minutes: 5
        run: cargo test -p unrelated-mcp-gateway --test integration_openapi_inspect -- --ignored --nocapture

      - name: Gateway PostgreSQL and cross-replica contracts
        timeout-minutes: 15
        run: make test-gateway-contracts

      - name: Real v1 clients and restart contracts
        timeout-minutes: 10
        run: make test-v1-journey

  ui:
    name: ui (unit, build, browser)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.2

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: UI format, lint and unit tests
        working-directory: ui
        run: npm run format:check && npm run lint && npm test

      - name: Install Chromium
        working-directory: ui
        run: npx playwright install --with-deps chromium

      - name: Standalone UI and real Gateway journey
        run: make test-ui-e2e

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ui-browser-failure
          path: output/playwright/e2e-*
          retention-days: 7

  helm:
    name: helm (lint, template)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Helm
        uses: azure/setup-helm@v5.0.1

      - name: Helm version
        run: helm version --short

      - name: Build chart dependencies
        run: |
          set -euo pipefail
          helm dependency build deploy/helm/unrelated-mcp-gateway
          helm dependency build deploy/helm/unrelated-mcp-gateway-stack

      - name: Helm lint
        run: |
          set -euo pipefail
          helm lint deploy/helm/unrelated-mcp-postgres
          helm lint deploy/helm/unrelated-mcp-gateway-operator
          helm lint deploy/helm/unrelated-mcp-gateway \
            --set database.url='postgres://postgres:postgres@db:5432/gateway?sslmode=disable' \
            --set auth.adminToken.value=ci-admin-token \
            --set session.secret.value=ci-session-secret \
            --set session.secretKeys.value=ci-secret-keys
          helm lint deploy/helm/unrelated-mcp-gateway-ui \
            --set gateway.dataBase=http://localhost:27100
          helm lint deploy/helm/unrelated-mcp-gateway-stack \
            -f deploy/helm/unrelated-mcp-gateway-stack/values-dev.yaml
          helm lint deploy/helm/unrelated-mcp-gateway-stack \
            -f deploy/helm/unrelated-mcp-gateway-stack/values-prod.yaml \
            --set gatewayui.gateway.dataBase=https://gateway.example.com \
            --set operator.gateway.bearerToken=ci-token
          helm lint deploy/helm/unrelated-mcp-gateway-stack \
            -f deploy/helm/unrelated-mcp-gateway-stack/values-dev.yaml \
            -f deploy/helm/unrelated-mcp-gateway-stack/values-kind-local.yaml

      - name: Helm template
        run: |
          set -euo pipefail
          helm template unrelated-mcp-gateway deploy/helm/unrelated-mcp-gateway \
            --set database.url='postgres://postgres:postgres@db:5432/gateway?sslmode=disable' \
            --set auth.adminToken.value=ci-admin-token \
            --set session.secret.value=ci-session-secret \
            --set session.secretKeys.value=ci-secret-keys >/dev/null
          helm template unrelated-mcp-gateway-ui deploy/helm/unrelated-mcp-gateway-ui \
            --set gateway.dataBase=http://localhost:27100 >/dev/null
          helm template unrelated-mcp-gateway-stack deploy/helm/unrelated-mcp-gateway-stack \
            -f deploy/helm/unrelated-mcp-gateway-stack/values-dev.yaml >/dev/null
          helm template unrelated-mcp-gateway-stack deploy/helm/unrelated-mcp-gateway-stack \
            -f deploy/helm/unrelated-mcp-gateway-stack/values-prod.yaml \
            --set gatewayui.gateway.dataBase=https://gateway.example.com \
            --set operator.gateway.bearerToken=ci-token >/dev/null
          helm template unrelated-mcp-gateway-stack deploy/helm/unrelated-mcp-gateway-stack \
            -f deploy/helm/unrelated-mcp-gateway-stack/values-dev.yaml \
            -f deploy/helm/unrelated-mcp-gateway-stack/values-kind-local.yaml >/dev/null
