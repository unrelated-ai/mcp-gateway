name: release

on:
  push:
    tags:
      # Supported release tags. Convention: <component>-vX.Y.Z (and prereleases like -rc.N)
      - "adapter-v*"
      - "gateway-v*"
      - "ui-v*"

permissions:
  contents: read

jobs:
  mcp_adapter:
    # Adapter releases: adapter-vX.Y.Z
    if: startsWith(github.ref, 'refs/tags/adapter-v')
    uses: ./.github/workflows/docker-release.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      image_name: ghcr.io/${{ github.repository_owner }}/mcp-adapter
      dockerfile: ./Dockerfile
      context: .
      cargo_pkg: unrelated-mcp-adapter
      binary_name: unrelated-mcp-adapter
      tag_prefix: adapter-v

  mcp_gateway:
    # Gateway releases: gateway-vX.Y.Z
    if: startsWith(github.ref, 'refs/tags/gateway-v')
    uses: ./.github/workflows/docker-release.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      image_name: ghcr.io/${{ github.repository_owner }}/mcp-gateway
      dockerfile: ./Dockerfile
      context: .
      cargo_pkg: unrelated-mcp-gateway
      binary_name: unrelated-mcp-gateway
      tag_prefix: gateway-v
      docker_target: gateway-runtime

  mcp_gateway_operator:
    # Gateway operator releases: gateway-vX.Y.Z (must match gateway version)
    if: startsWith(github.ref, 'refs/tags/gateway-v')
    uses: ./.github/workflows/docker-release.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      image_name: ghcr.io/${{ github.repository_owner }}/mcp-gateway-operator
      dockerfile: ./Dockerfile
      context: .
      cargo_pkg: unrelated-mcp-gateway-operator
      binary_name: unrelated-mcp-gateway-operator
      tag_prefix: gateway-v
      docker_target: gateway-operator-runtime

  mcp_gateway_migrator:
    # Gateway migrator releases: gateway-vX.Y.Z (must match gateway version)
    if: startsWith(github.ref, 'refs/tags/gateway-v')
    uses: ./.github/workflows/docker-release.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      image_name: ghcr.io/${{ github.repository_owner }}/mcp-gateway-migrator
      dockerfile: ./Dockerfile
      context: .
      cargo_pkg: unrelated-mcp-gateway
      binary_name: unrelated-mcp-gateway
      tag_prefix: gateway-v
      docker_target: gateway-migrator

  gateway_cli_binaries:
    # Gateway CLI release assets: gateway-vX.Y.Z
    if: startsWith(github.ref, 'refs/tags/gateway-v')
    uses: ./.github/workflows/binary-release.yml
    permissions:
      contents: write
      id-token: write
      attestations: write
    secrets: inherit
    with:
      cargo_pkg: unrelated-gateway-admin
      binary_name: unrelated-gateway-admin
      tag_prefix: gateway-v
      target: x86_64-unknown-linux-musl

  unrelated_cli_binaries:
    # User-facing CLI release assets: gateway-vX.Y.Z
    if: startsWith(github.ref, 'refs/tags/gateway-v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    uses: ./.github/workflows/binary-release.yml
    permissions:
      contents: write
      id-token: write
      attestations: write
    secrets: inherit
    with:
      cargo_pkg: unrelated-cli
      binary_name: unrelated
      tag_prefix: gateway-v
      runner: ${{ matrix.runner }}
      target: ${{ matrix.target }}

  deployment_packages:
    # Standalone Helm packages and quickstart files accompany the Gateway release.
    if: startsWith(github.ref, 'refs/tags/gateway-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Helm
        uses: azure/setup-helm@v5.0.1

      - name: Validate and package deployment files
        id: deployment_meta
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#gateway-v}"
          if [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "prerelease=false" >> "${GITHUB_OUTPUT}"
          else
            echo "prerelease=true" >> "${GITHUB_OUTPUT}"
          fi
          make helm-validate
          mkdir -p dist
          for chart in deploy/helm/*; do
            chart_version="$(helm show chart "${chart}" | awk '/^version:/ {print $2}')"
            if [[ "${chart_version}" != "${version}" ]]; then
              echo "Release guard failed: ${chart} has version ${chart_version}; expected ${version}."
              exit 1
            fi
            helm package "${chart}" --destination dist
          done
          cp docker-compose.quickstart.yml dist/mcp-gateway-compose.yml
          cp deploy/images.env dist/mcp-gateway-images.env
          (cd dist && sha256sum *.tgz *.yml *.env > deployment-SHA256SUMS)

      - name: Upload deployment packages
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ steps.deployment_meta.outputs.prerelease == 'true' }}
          files: |
            dist/*.tgz
            dist/*.yml
            dist/*.env
            dist/deployment-SHA256SUMS

  mcp_adapter_binaries:
    # Adapter release assets: adapter-vX.Y.Z
    if: startsWith(github.ref, 'refs/tags/adapter-v')
    uses: ./.github/workflows/binary-release.yml
    permissions:
      contents: write
      id-token: write
      attestations: write
    secrets: inherit
    with:
      cargo_pkg: unrelated-mcp-adapter
      binary_name: unrelated-mcp-adapter
      tag_prefix: adapter-v
      target: x86_64-unknown-linux-musl

  mcp_gateway_ui:
    # Web UI releases: ui-vX.Y.Z
    if: startsWith(github.ref, 'refs/tags/ui-v')
    uses: ./.github/workflows/ui-docker-release.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      image_name: ghcr.io/${{ github.repository_owner }}/mcp-gateway-ui
      dockerfile: ./ui/Dockerfile
      context: ./ui
      tag_prefix: ui-v
