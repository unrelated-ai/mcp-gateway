[package]
name = "unrelated-gateway-admin"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI for managing Unrelated MCP Gateway (admin/control plane)"

[dependencies]
unrelated-gateway-api = { path = "../gateway-api" }
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
owo-colors = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
url = { workspace = true }
unrelated-tool-transforms = { path = "../tool-transforms" }

[[bin]]
name = "unrelated-gateway-admin"
path = "src/main.rs"
