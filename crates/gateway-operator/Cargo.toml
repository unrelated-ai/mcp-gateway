[package]
name = "unrelated-mcp-gateway-operator"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
unrelated-gateway-api = { path = "../gateway-api" }
unrelated-mcp-support = { path = "../mcp-support" }
anyhow = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
hostname = { workspace = true }
k8s-openapi = { workspace = true, features = ["v1_32"] }
kube = { workspace = true, features = ["runtime", "derive", "client", "rustls-tls", "aws-lc-rs"] }
kube-runtime = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "time"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
bollard = { workspace = true }
