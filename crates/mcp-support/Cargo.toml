[package]
name = "unrelated-mcp-support"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64.workspace = true
http.workspace = true
rmcp = { workspace = true, features = ["client", "server", "transport-io", "transport-streamable-http-client"] }
futures.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sse-stream.workspace = true
tokio = { workspace = true, features = ["io-util", "sync", "rt", "process", "time"] }
tokio-util = { workspace = true, features = ["codec"] }
unrelated-env = { path = "../env" }
