[package]
name = "unrelated-cli"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Client-side CLI and compact MCP proxy for Unrelated MCP Gateway"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
dirs = { workspace = true }
hex = { workspace = true }
jsonschema = { workspace = true }
reqwest = { workspace = true, features = ["form", "json", "rustls"] }
rpassword = { workspace = true }
rmcp = { workspace = true, features = ["auth", "client", "server", "transport-io", "transport-streamable-http-client-reqwest", "transport-streamable-http-server"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["full"] }
toml = { workspace = true }
url = { workspace = true }
webbrowser = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
tempfile = { workspace = true }
tokio-util = { workspace = true }

[[bin]]
name = "unrelated"
path = "src/main.rs"
