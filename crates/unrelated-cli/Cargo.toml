[package]
name = "unrelated-cli"
version = "0.13.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Client-side CLI and compact MCP proxy for Unrelated MCP Gateway"

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
hex = "0.4"
jsonschema = { version = "0.46.10", default-features = false }
reqwest = { version = "0.13.4", default-features = false, features = ["form", "json", "rustls"] }
rpassword = "7"
rmcp = { version = "2.2.0", features = ["auth", "client", "server", "transport-io", "transport-streamable-http-client-reqwest", "transport-streamable-http-server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
tokio = { version = "1", features = ["full"] }
toml = "0.9"
url = "2"
webbrowser = "1.2.4"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["async-secret-service", "crypto-rust", "tokio"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[dev-dependencies]
axum = "0.8"
tempfile = "3"
tokio-util = "0.7"

[[bin]]
name = "unrelated"
path = "src/main.rs"
