[package]
name = "unrelated-mcp-gateway"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "MCP Gateway (beta): authn/z + tenancy + policy + transforms"

[dependencies]
unrelated-gateway-api = { path = "../gateway-api", features = ["axum"] }
unrelated-mcp-support = { path = "../mcp-support" }
tokio = { workspace = true, features = ["full", "signal"] }
tokio-util = { workspace = true }
axum = { workspace = true, features = ["macros"] }
clap = { workspace = true, features = ["derive", "env"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
serde = { workspace = true, features = ["derive"] }
serde-saphyr = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
async-stream = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest", "elicitation"] }
reqwest = { workspace = true, features = ["json", "rustls", "stream"] }
jsonwebtoken = { workspace = true, features = ["aws_lc_rs"] }
base64 = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
hex = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
# RMCP exposes these types publicly; keep its 0.2 ABI until RMCP migrates.
sse-stream = { workspace = true }
sqlx = { workspace = true, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "json"] }
parking_lot = { workspace = true }
unrelated-http-tools = { path = "../http-tools" }
unrelated-openapi-tools = { path = "../openapi-tools" }
unrelated-tool-transforms = { path = "../tool-transforms" }
unrelated-env = { path = "../env" }
rusty_paseto = { workspace = true }
time = { workspace = true, features = ["formatting", "parsing"] }
jsonschema = { workspace = true, default-features = true }
strsim = { workspace = true }
chacha20poly1305 = { workspace = true }
getrandom = { workspace = true }
zeroize = { workspace = true }

[[bin]]
name = "unrelated-mcp-gateway"
path = "src/main.rs"

[dev-dependencies]
rsa = { workspace = true, features = ["pem"] }
tempfile = { workspace = true }
testcontainers = { workspace = true }
unrelated-test-support = { path = "../test-support" }
unrelated-cli = { path = "../unrelated-cli" }
